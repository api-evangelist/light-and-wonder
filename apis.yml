    name: Light & Wonder Gateway
    description: >-
      Light & Wonder Gateway is the partner hub where customers and studios manage
      games, roadmaps, reports, game assets and integrations ("Integrate our tools
      ... comprehensive documentation"). Integration documentation sits behind an
      Okta / Auth0 customer login; no public API reference, base URL or
      machine-readable contract is published.
