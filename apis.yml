description: >-
  Light & Wonder is a leading cross-platform global games company that develops
  and distributes gaming content across land-based casinos, mobile platforms,
  and online channels. The company's portfolio includes titles such as
  Dancing Drums Prosperity, Rainbow Riches, and Gold Fish, and includes
  subsidiaries SciPlay (mobile social gaming) and Grover Gaming. Light & Wonder
  operates customer-facing support portals for both gaming and iGaming
  partners.

